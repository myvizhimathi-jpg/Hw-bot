name: hotwheels-watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hw-bot
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright requests
          playwright install --with-deps chromium
      - name: Run watcher
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python firstcry_hotwheels_bot.py --duration 180
      - name: Save state
        if: always()
        run: |
          git config user.name "hw-bot"
          git config user.email "hw-bot@users.noreply.github.com"
          git add hw_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "state"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 3
            done
          fi
