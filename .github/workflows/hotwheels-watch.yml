name: hotwheels-watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hw-bot
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright requests
          playwright install --with-deps chromium
      - name: Run watcher
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python firstcry_hotwheels_bot.py --duration 240
      - name: Save state
        run: |
          git config user.name "hw-bot"
          git config user.email "hw-bot@users.noreply.github.com"
          git add hw_state.json || true
          git diff --cached --quiet || (git commit -m "state" && git push)
